services:
  postgres:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: john
      POSTGRES_PASSWORD: john
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "5432:5432"
